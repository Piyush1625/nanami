name: nanami
description: Nanami music player.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
