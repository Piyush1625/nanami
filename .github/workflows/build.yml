name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name nanami --org com.piyush1625 --platforms=android
      - name: Force compileSdk 36 for all modules
        run: |
          # 1. Ensure the app module uses 36
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
          fi

          # 2. Append the override block to the root android/build.gradle
          cat << 'GRADLE_EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          if (compileSdkVersion == null || compileSdkVersion.toString().startsWith("34") || compileSdkVersion.toString().startsWith("35")) {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
          }
          GRADLE_EOF
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nanami-apk
          path: build/app/outputs/flutter-apk/app-release.apk
